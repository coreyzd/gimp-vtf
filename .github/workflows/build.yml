name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    container: debian:${{ matrix.debian }}
    strategy:
      fail-fast: false
      matrix:
        debian: [trixie, testing]
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build pkg-config gcc g++ libgimp-3.0-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: file-vtf-linux-debian-${{ matrix.debian }}
          path: build/file-vtf/

  windows:
    name: Windows (MSYS2 ${{ matrix.sys }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys: [ucrt64, clang64]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            pkgconf:p
            gimp:p

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Show DLL dependencies
        run: ldd build/file-vtf/file-vtf.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: file-vtf-windows-${{ matrix.sys }}
          path: build/file-vtf/
